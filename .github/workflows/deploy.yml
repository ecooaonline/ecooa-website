name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # O site 3.0 é estático e não precisa de build: a pasta deploy/ é
      # publicada como está. O projeto Astro segue no repositório, mas
      # não é mais o que vai ao ar.
      - name: Conferir arquivos essenciais da publicação
        run: |
          test -f deploy/index.html
          test -f deploy/support.js
          test -f deploy/dados-ecooa.js
          test -f deploy/CNAME   # segura o domínio www.somosecooa.com.br
          ! grep -rq "unpkg.com" deploy/support.js  # nada de CDN externo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
